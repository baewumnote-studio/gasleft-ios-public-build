name: gasleft
description: "No-sensor propane/LPG cylinder level tracker by weight."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  sqflite: 2.4.4+1
  path: 1.9.1
  uuid: 4.6.0
  intl: 0.20.3
  flutter_local_notifications: 22.3.1
  flutter_timezone: 5.1.1
  timezone: 0.11.1
  google_mobile_ads: 9.1.0
  package_info_plus: 10.2.2
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
